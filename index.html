<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>3D Modellvergleich</title>

<script type="module"
  src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

/* Sidebar */
#sidebar {
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;
  width: 220px;
  background: #1e1e1e;
  color: white;
  padding: 20px;
}

button {
  width: 100%;
  margin-bottom: 8px;
  padding: 10px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  background: #333;
  color: white;
}

#compare-btn {
  margin-top: 20px;
  background: #0077ff;
}

/* Main view */
#main {
  position: fixed;
  left: 220px;
  right: 0;
  top: 0;
  bottom: 0;
  background: #eee;
}

#main model-viewer {
  width: 100%;
  height: 100%;
}

/* Compare */
#compare {
  position: fixed;
  inset: 0;
  background: white;
  display: none;
}

.compare-viewer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

#mvA { clip-path: inset(0 50% 0 0); }
#mvB { clip-path: inset(0 0 0 50%); }

#slider {
  position: absolute;
  top: 0;
  left: 50%;
  width: 4px;
  height: 100%;
  background: red;
  cursor: ew-resize;
}

#back {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 10;
  background: black;
}

model-viewer::part(default-controls) {
  display: none;
}
</style>
</head>

<body>

<div id="sidebar">
  <button onclick="setMain('1150.glb')">1150</button>
  <button onclick="setMain('1175.glb')">1175</button>
  <button onclick="setMain('1374.glb')">1374</button>
  <button onclick="setMain('1550.glb')">1550</button>
  <button onclick="setMain('1630.glb')">1630</button>
  <button onclick="setMain('1936.glb')">1936</button>
  <button id="compare-btn">Vergleichen</button>
</div>

<div id="main">
  <model-viewer id="mainModel"
    src="1150.glb"
    camera-controls
    interaction-prompt="none">
  </model-viewer>
</div>

<div id="compare">
  <button id="back">← Zurück</button>

  <model-viewer id="mvA"
    class="compare-viewer"
    camera-controls
    interaction-prompt="none">
  </model-viewer>

  <model-viewer id="mvB"
    class="compare-viewer"
    interaction-prompt="none">
  </model-viewer>

  <div id="slider"></div>
</div>

<script src="compare.js"></script>
</body>
</html>
