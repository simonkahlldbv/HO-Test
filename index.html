<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>3D Modellvergleich</title>

<style>
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

/* Sidebar */
#sidebar {
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;
  width: 220px;
  background: #1e1e1e;
  color: white;
  padding: 20px;
  box-sizing: border-box;
  z-index: 10;
}

button {
  width: 100%;
  margin-bottom: 8px;
  padding: 10px;
  border: none;
  border-radius: 6px;
  background: #333;
  color: white;
  cursor: pointer;
}

#compareBtn {
  background: #0077ff;
  margin-top: 15px;
}

/* Main view */
#viewer {
  position: fixed;
  left: 220px;
  right: 0;
  top: 0;
  bottom: 0;
}

/* Compare overlay */
#compare {
  position: fixed;
  inset: 0;
  background: white;
  display: none;
  z-index: 50;
}

#compareSidebar {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 220px;
  background: #222;
  color: white;
  padding: 15px;
  box-sizing: border-box;
  z-index: 60;
}

#compareView {
  position: absolute;
  left: 220px;
  right: 0;
  top: 0;
  bottom: 0;
}

#slider {
  position: absolute;
  top: 0;
  left: 50%;
  width: 4px;
  height: 100%;
  background: red;
  cursor: ew-resize;
  z-index: 55;
}

canvas {
  display: block;
}
</style>
</head>

<body>

<!-- STARTSEITE -->
<div id="sidebar">
  <button onclick="loadMain('1150.glb')">1150</button>
  <button onclick="loadMain('1175.glb')">1175</button>
  <button onclick="loadMain('1374.glb')">1374</button>
  <button onclick="loadMain('1550.glb')">1550</button>
  <button onclick="loadMain('1630.glb')">1630</button>
  <button onclick="loadMain('1936.glb')">1936</button>

  <button id="compareBtn">Vergleichen</button>
</div>

<div id="viewer"></div>

<!-- VERGLEICH -->
<div id="compare">
  <div id="compareSidebar">
    <strong>Links</strong>
    <button onclick="loadLeft('1150.glb')">1150</button>
    <button onclick="loadLeft('1374.glb')">1374</button>
    <button onclick="loadLeft('1630.glb')">1630</button>

    <hr>

    <strong>Rechts</strong>
    <button onclick="loadRight('1175.glb')">1175</button>
    <button onclick="loadRight('1550.glb')">1550</button>
    <button onclick="loadRight('1936.glb')">1936</button>

    <hr>
    <button onclick="closeCompare()">← Zurück</button>
  </div>

  <div id="compareView"></div>
  <div id="slider"></div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
