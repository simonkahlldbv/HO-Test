<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Three.js 3D Vergleich</title>

<style>
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

/* Sidebar */
#sidebar {
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;
  width: 220px;
  background: #1e1e1e;
  color: white;
  padding: 20px;
  box-sizing: border-box;
  z-index: 10;
}

button {
  width: 100%;
  margin-bottom: 8px;
  padding: 10px;
  border: none;
  border-radius: 6px;
  background: #333;
  color: white;
  cursor: pointer;
}

/* Scene */
#container {
  position: fixed;
  left: 220px;
  right: 0;
  top: 0;
  bottom: 0;
}

/* Slider */
#slider {
  position: fixed;
  top: 0;
  left: 50%;
  width: 4px;
  height: 100%;
  background: red;
  cursor: ew-resize;
  z-index: 5;
}
</style>
</head>

<body>

<div id="sidebar">
  <button onclick="loadLeft('1150.glb')">Links 1150</button>
  <button onclick="loadLeft('1374.glb')">Links 1374</button>
  <button onclick="loadLeft('1630.glb')">Links 1630</button>

  <hr>

  <button onclick="loadRight('1175.glb')">Rechts 1175</button>
  <button onclick="loadRight('1550.glb')">Rechts 1550</button>
  <button onclick="loadRight('1936.glb')">Rechts 1936</button>
</div>

<div id="container"></div>
<div id="slider"></div>

<script type="module" src="main.js"></script>
</body>
</html>
