<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>GLB Viewer</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    #ui {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 200;
    }

    button {
      padding: 8px 12px;
      margin: 4px 0;
      cursor: pointer;
    }

    /* ---------- START VIEW ---------- */
    #mainView {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    /* ---------- COMPARE MODE ---------- */
    #compare {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 10;
    }

    #compareSidebar {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 220px;
      background: #1e1e1e;
      color: white;
      padding: 10px;
      z-index: 100;
      pointer-events: auto;
    }

    #compareView {
      position: absolute;
      left: 220px;
      right: 0;
      top: 0;
      bottom: 0;
      z-index: 50;
      pointer-events: auto;
    }

    .split {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
    }

    #leftView {
      left: 0;
    }

    #rightView {
      right: 0;
    }

    .divider {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 2px;
      background: red;
      z-index: 90;
      pointer-events: none;
    }

    h3 {
      margin-top: 10px;
      margin-bottom: 5px;
    }
  </style>
</head>
<body>

<div id="ui">
  <button id="btnCompare">Vergleichen</button>
</div>

<div id="mainView"></div>

<div id="compare">
  <div id="compareSidebar">
    <button id="btnBack">← Zurück</button>

    <h3>Links</h3>
    <button data-side="left" data-model="1150.glb">1150</button>
    <button data-side="left" data-model="1374.glb">1374</button>
    <button data-side="left" data-model="1630.glb">1630</button>

    <h3>Rechts</h3>
    <button data-side="right" data-model="1175.glb">1175</button>
    <button data-side="right" data-model="1550.glb">1550</button>
    <button data-side="right" data-model="1936.glb">1936</button>
  </div>

  <div id="compareView">
    <div id="leftView" class="split"></div>
    <div id="rightView" class="split"></div>
    <div class="divider"></div>
  </div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
