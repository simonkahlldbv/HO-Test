<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>3D Modellvergleich</title>

<script type="module"
  src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

#compare {
  position: fixed;
  inset: 0;
  background: white;
}

/* Viewer */
#container {
  position: absolute;
  inset: 0;
}

model-viewer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  --poster-color: transparent;
}

/* clipping */
#mvA { clip-path: inset(0 50% 0 0); }
#mvB { clip-path: inset(0 0 0 50%); }

/* slider */
#slider {
  position: absolute;
  top: 0;
  left: 50%;
  width: 5px;
  height: 100%;
  background: red;
  transform: translateX(-50%);
  cursor: ew-resize;
  z-index: 10;
}

/* buttons */
.selector {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 20;
}

#left { left: 20px; }
#right { right: 20px; }

.selector button {
  padding: 6px 10px;
  border-radius: 6px;
  border: none;
  background: #222;
  color: white;
  cursor: pointer;
}

model-viewer::part(default-controls) {
  display: none;
}
</style>
</head>

<body>

<div id="compare">
  <div id="container">
    <!-- EINZIGE KAMERA -->
    <model-viewer id="mvA"
      src="1150.glb"
      camera-controls
      interaction-prompt="none">
    </model-viewer>

    <!-- PASSIVER VIEWER -->
    <model-viewer id="mvB"
      src="1936.glb"
      interaction-prompt="none">
    </model-viewer>
  </div>

  <div id="slider"></div>

  <div id="left" class="selector">
    <button onclick="setLeft('1150.glb')">1150</button>
    <button onclick="setLeft('1175.glb')">1175</button>
    <button onclick="setLeft('1374.glb')">1374</button>
    <button onclick="setLeft('1550.glb')">1550</button>
    <button onclick="setLeft('1630.glb')">1630</button>
    <button onclick="setLeft('1936.glb')">1936</button>
  </div>

  <div id="right" class="selector">
    <button onclick="setRight('1150.glb')">1150</button>
    <button onclick="setRight('1175.glb')">1175</button>
    <button onclick="setRight('1374.glb')">1374</button>
    <button onclick="setRight('1550.glb')">1550</button>
    <button onclick="setRight('1630.glb')">1630</button>
    <button onclick="setRight('1936.glb')">1936</button>
  </div>
</div>

<script src="compare-sync.js"></script>
</body>
</html>
